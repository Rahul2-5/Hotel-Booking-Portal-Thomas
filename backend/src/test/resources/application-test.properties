# Test settings override the main profile's MySQL environment placeholders.
spring.datasource.url=jdbc:h2:mem:hotel_booking_test;MODE=MySQL;DB_CLOSE_DELAY=-1
spring.datasource.driver-class-name=org.h2.Driver
spring.datasource.username=sa
spring.datasource.password=
spring.jpa.hibernate.ddl-auto=create-drop
spring.jpa.properties.hibernate.hbm2ddl.halt_on_error=true
# Hibernate creates tables from entities. Never import db/schema.sql into tests.
spring.sql.init.mode=never
